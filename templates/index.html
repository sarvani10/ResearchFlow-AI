{% extends 'base.html' %}

{% block content %}
<header class="page-header">
    <h2>Analyze <em>New Research</em></h2>
</header>

<section class="analyze-section">
    <form id="analyze-form" class="two-column-form">
        <div class="form-group">
            <label for="topic">Research Topic</label>
            <input type="text" id="topic" name="topic" placeholder="e.g. Gut microbiome in Alzheimer's disease" required>
        </div>
        <div class="form-group">
            <label for="urls">Paper URLs — one per line</label>
            <textarea id="urls" name="urls" rows="4" placeholder="https://pubmed.ncbi.nlm.nih.gov/...&#10;https://arxiv.org/abs/..." required></textarea>
        </div>
        <div class="form-actions">
            <button type="submit" id="analyze-btn" class="btn-primary">Start Analysis &rarr;</button>
        </div>
    </form>
</section>

<!-- Loading State -->
<div id="loading-state" class="hidden">
    <div class="spinner"></div>
    <p>Processing research pipeline...</p>
</div>

<!-- Results Area -->
<div id="results-area" class="hidden">
    <header class="page-header mt-8">
        <h2>Evolving Summary &mdash; <em id="result-topic"></em></h2>
    </header>

    <div class="result-grid">
        <!-- Main Summary -->
        <div class="summary-box full-width">
            <div class="box-label">Paper Summary</div>
            <div id="res-summary" class="serif-text"></div>
        </div>

        <div class="column">
            <!-- Novel Contributions -->
            <div class="section-label">Novel Contributions</div>
            <div id="res-novel" class="list-container"></div>
            
            <!-- Open Questions -->
            <div class="section-label mt-6">Open Questions</div>
            <div id="res-questions" class="list-container"></div>
        </div>

        <div class="column">
            <!-- Memory Comparison -->
            <div class="section-label">Memory Comparison (Conflicts / Agreements)</div>
            <div class="summary-box comparison-card">
                <div id="res-comparison"></div>
            </div>

            <!-- Field Trajectory -->
            <div class="section-label mt-6">Field Trajectory</div>
            <div class="summary-box trajectory-card">
                <div id="res-trajectory"></div>
            </div>
            
            <!-- Key Insights (Core Findings) -->
            <div class="section-label mt-6">Key Insights</div>
            <div id="res-insights" class="list-container"></div>
        </div>
    </div>
</div>
{% endblock %}
